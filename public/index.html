<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toshkent Restoranlari</title>

  <!-- Leaflet Xarita Stili -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Shaxsiy CSS Faylingiz -->
  <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>

  <!-- Asosiy Tepalangan Sarlavha (Header) -->
  <header>
    <h2>🍽️ Toshkent Restoranlari</h2>
  </header>

  <!-- Interaktiv Xarita -->
  <div id="map"></div>

  <!-- Kontent Qismi (Qidiruv, Filter va Kartochkalar) -->
  <div class="container">
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Restoran nomi yoki manzil bo'yicha qidiruv...">
      <select id="categoryFilter">
        <option value="">Barcha Kategoriyalar</option>
      </select>
    </div>

    <!-- Restoranlar Chiqadigan Grid Maydoni -->
    <div id="restaurantList" class="grid"></div>
  </div>

  <!-- Leaflet JS hamda Shaxsiy Script Faylingiz -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>

</body>
</html>
